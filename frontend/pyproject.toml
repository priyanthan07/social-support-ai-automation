[project]
name = "social-support-frontend"
version = "0.1.0"
description = "Custom Streamlit UI for the Social Support AI automation prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.58.0",
    "requests>=2.34.2",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssa_frontend"]
