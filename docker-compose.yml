# Social Support AI Automation -- full local stack.
# All services run locally. Config is injected from `.env` + `.env.dev`
# (copy the *.example files first). For production, override with `.env.prod`.

x-env: &default-env
  env_file:
    - .env
    - .env.dev

services:
  # --------------------------------------------------------------------- #
  # Data layer                                                            #
  # --------------------------------------------------------------------- #
  postgres:
    image: postgres:16-alpine
    container_name: ssa_postgres
    restart: unless-stopped
    <<: *default-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: ssa_mongodb
    restart: unless-stopped
    <<: *default-env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ssa_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: ssa_neo4j
    restart: unless-stopped
    <<: *default-env
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  # --------------------------------------------------------------------- #
  # Local model hosting                                                   #
  # --------------------------------------------------------------------- #
  ollama:
    image: ollama/ollama:latest
    container_name: ssa_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------------------- #
  # Application services                                                  #
  # --------------------------------------------------------------------- #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssa_backend
    restart: unless-stopped
    <<: *default-env
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/artifacts:ro
      - ./data:/data:ro
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssa_frontend
    restart: unless-stopped
    <<: *default-env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
  neo4j_data:
  ollama_data:
  backend_uploads:
