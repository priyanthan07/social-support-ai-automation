[project]
name = "social-support-ml"
version = "0.1.0"
description = "Offline synthetic data generation + scikit-learn training for the Social Support AI prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.9.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "joblib>=1.5.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "fpdf2>=2.8.7",
    "faker>=40.28.1",
    "matplotlib>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssa_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
