[project]
name = "social-support-backend"
version = "0.1.0"
description = "FastAPI backend + LangGraph agents for the Social Support AI automation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.5",
    "pymongo>=4.17.0",
    "qdrant-client>=1.18.0",
    "neo4j>=6.2.0",
    "langgraph>=1.2.7",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.13.0",
    "ollama>=0.6.2",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "joblib>=1.5.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
